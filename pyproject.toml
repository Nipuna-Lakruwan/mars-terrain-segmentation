[project]
name = "mars-terrain"
version = "0.1.0"
description = "Terrain segmentation on NASA JPL's AI4Mars (Curiosity Navcam): soil, bedrock, sand, big rock"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=2.0",
    "pyarrow>=17",
    "pillow>=10",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
